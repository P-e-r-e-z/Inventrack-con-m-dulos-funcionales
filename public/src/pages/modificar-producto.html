<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InvenTrack - Modificar Producto</title>

    <link rel="stylesheet" href="../styles/modificar-producto.css">
    <link rel="stylesheet" href="../styles/estilo.css">

</head>


<body>

    <div class="contenedor">


        <!-- =================================
             BARRA LATERAL
        ================================== -->

        <aside class="sidebar">

            <div class="perfil">

                <div class="foto-perfil">

                    <img
                        src="https://via.placeholder.com/120"
                        alt="Foto de usuario"
                    >

                </div>

                <h3>User1234</h3>

            </div>


            <nav class="menu">

                <a href="../pages/productos.html">
                    PRODUCTOS
                </a>

                <a href="../pages/salidas.html">
                    SALIDAS
                </a>

                <a href="#">
                    REPORTES
                </a>

                <a href="../pages/configuracion.html" class="activo">
                    CONFIGURACION
                </a>

            </nav>


            <a href="#" class="cerrar-sesion" id="btnCerrarSesion">
                CERRAR SESION
            </a>

        </aside>



        <!-- =================================
             CONTENIDO
        ================================== -->

        <main class="contenido-modificar">


            <h1>CONFIGURACIÓN</h1>


            <!-- =================================
                 TARJETA MODIFICAR PRODUCTO
            ================================== -->

            <section class="tarjeta-modificar">


                <h2>Modificar un producto</h2>


                <!-- PRODUCTO A MODIFICAR -->

                <div class="producto-seleccion">

                    <label for="producto">
                         Nombre del producto
                    </label>

                    <select id="producto">
                        <option value="">
                             Seleccionar producto
                        </option>
                    </select>

                </div>

                <!-- MODIFICACIONES -->

                <h3>Modificaciones</h3>


                <div class="campos-modificacion">



                    <!-- NOMBRE -->

                    <div class="campo">

                        <label for="nombre">
                             Nombre
                        </label>

                        <input
                         type="text"
                         id="nombre"
                        >

                    </div>


                   


                    <!-- CATEGORIA -->

                    <div class="campo">

                        <label for="categoria">
                            Categoria
                        </label>

                        <input
                            type="text"
                            id="categoria"
                        >

                    </div>


                    <!-- PRECIO -->

                    <div class="campo">

                        <label for="precio">
                            Precio
                        </label>

                        <input
                            type="number"
                            id="precio"
                        >

                    </div>


                    <!-- CANTIDAD -->

                    <div class="campo">

                        <label for="cantidad">
                            Cantidad
                        </label>

                        <input
                            type="number"
                            id="cantidad"
                        >

                    </div>


                </div>


                <!-- BOTÓN -->

                <button
                    type="button"
                    class="btn-modificar"
                    id="btnModificar"
                >
                    Modificar
                </button>


            </section>


        </main>


    </div>


    <script src="../js/modificar-producto.js"></script>

</body>

</html>
