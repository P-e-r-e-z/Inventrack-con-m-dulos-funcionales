<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>InvenTrack - Salidas</title>

    <link rel="stylesheet" href="../styles/salidas.css">
    <link rel="stylesheet" href="../styles/estilo.css">

    <!-- Font Awesome -->
    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

</head>


<body>

    <div class="contenedor">


        
             <!--BARRA LATERAL-->
        

        <aside class="sidebar">


            <!-- PERFIL -->

            <div class="perfil">

                <div class="foto-perfil">

                    <img
                        src="https://via.placeholder.com/120"
                        alt="Foto de usuario"
                    >

                </div>

                <h3>User1234</h3>

            </div>


            <!-- MENÚ -->

            <nav class="menu">

                <a href="../pages/productos.html">
                    PRODUCTOS
                </a>

                <a href="../pages/salidas.html" class="activo">
                    SALIDAS
                </a>

                <a href="#">
                    REPORTES
                </a>

                <a href="../pages/configuracion.html">
                    CONFIGURACIÓN
                </a>

            </nav>


            <!-- CERRAR SESIÓN -->

            <a href="#" class="cerrar-sesion" id="btnCerrarSesion">
                CERRAR SESIÓN
            </a>


        </aside>


        <!-- =================================
             CONTENIDO PRINCIPAL
        ================================== -->

        <main class="contenido-salidas">


            <h1>REGISTRO DE SALIDAS</h1>


            <!-- =================================
                 FORMULARIO NUEVA SALIDA
            ================================== -->

            <section class="tarjeta-salida">


                <h2>NUEVA SALIDA</h2>


                <form id="formSalida">


                    <!-- CAMPOS PRINCIPALES -->

                    <div class="campos-principales">


                        <!-- ID PRODUCTO -->

                        <div class="campo">

                           <label for="producto">
                             Producto*
                            </label>

                            <select id="producto" required>
                                <option value="">Seleccionar producto</option>
                            </select>

                        </div>


                        <!-- FECHA -->

                        <div class="campo">

                            <label for="fecha">
                                Fecha*
                            </label>

                            <input
                                type="date"
                                id="fecha"
                                required
                            >

                        </div>


                        <!-- CANTIDAD -->

                        <div class="campo">

                            <label for="cantidadSalida">
                                Cantidad*
                            </label>

                            <input
                                type="number"
                                id="cantidadSalida"
                                min="1"
                                required
                            >

                        </div>


                    </div>


                    <!-- OBSERVACIONES -->

                    <div class="campo observaciones">

                        <label for="observaciones">
                            Observaciones
                        </label>

                        <textarea
                            id="observaciones"
                            rows="4"
                        ></textarea>

                    </div>


                    <!-- BOTONES -->

                    <div class="botones-salida">

                        <button
                            type="submit"
                            class="btn-hecho"
                        >
                            Hecho
                        </button>


                        <button
                            type="reset"
                            class="btn-limpiar"
                        >
                            Limpiar
                        </button>

                    </div>


                </form>


            </section>


        </main>


    </div>


    <script src="../js/salidas.js"></script>

</body>

</html>
